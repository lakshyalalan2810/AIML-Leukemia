# Configuration for EfficientNet-B1 on C-NMC 2019
# Task: Binary single-cell leukemia classification (HEM=0, ALL=1)
# Primary condition: Weighted Cross-Entropy to target specificity deficit

dataset:
  name: "C-NMC"
  root: "data/raw/cnmc"
  data_dir: "data/cnmc"
  positive_class: "ALL"
  positive_label: 1
  negative_class: "HEM"
  negative_label: 0
  active_dev_cells: 10655
  locked_preliminary_cells: 1861
  supergroups: 66

model:
  name: "efficientnet_b1"
  backbone: "tf_efficientnet_b1.aa_in1k"
  pretrained_sha256: "ea7a6ee06a3b24557c0c2c29bf22d6e0afae8008a10300c4dcc584a4b382f049"
  input_size: 240
  feature_dim: 1280
  dropout: 0.2
  num_classes: 2
  parameter_count: 6515746
  target_layer: "conv_head"

preprocessing:
  input_size: 240
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  clahe: false
  stain_normalization: false
  grayscale: false

augmentation:
  policy: "deterministic_d4_only"
  use_opaque_keys: true

loss:
  condition: "efficientnet_b1_raw_weighted_ce"
  float32_computation: true

training:
  seeds: [42]
  outer_folds: 5
  inner_seed_formula: "seed * 1000 + outer_fold * 10 + 7"
  batch_size: 8
  grad_accum_steps: 1
  warmup_epochs: 5
  max_epochs: 50
  min_executed_epochs: 15
  head_warmup_lr: 3.0e-4
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  weight_decay: 1.0e-4
  adamw_betas: [0.9, 0.999]
  cosine_multiplier_low: 0.1
  grad_clip: 1.0
  patience: 10
  amp: true
  amp_init_scale: 32768.0

selection:
  criteria: ["mcc", "balanced_accuracy", "nll", "epoch"]

outputs:
  models_dir: "outputs/models/efficientnet_b1"
  predictions_dir: "outputs/predictions/efficientnet_b1"
  metrics_dir: "outputs/metrics/efficientnet_b1"
  gradcam_dir: "outputs/gradcam/efficientnet_b1"
