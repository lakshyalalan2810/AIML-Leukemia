# Configuration for ConvNeXtV2-Tiny on C-NMC 2019
# Task: Binary single-cell leukemia classification (HEM=0, ALL=1)

dataset:
  name: "C-NMC"
  root: "data/raw/cnmc"
  data_dir: "data/cnmc"
  positive_class: "ALL"
  positive_label: 1
  negative_class: "HEM"
  negative_label: 0
  active_dev_cells: 10655
  locked_preliminary_cells: 1861
  supergroups: 66

model:
  name: "convnextv2_tiny"
  backbone: "convnextv2_tiny.fcmae_ft_in1k"
  pretrained_sha256: "fdfb4edfa5abb3b4ea29ab17e6fae5c117dc6cc32ecfb1d0726a156f40a4c1a5"
  input_size: 224
  feature_dim: 768
  num_classes: 2
  parameter_count: 27868034
  target_layer: "stages.3.blocks.2"

preprocessing:
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  clahe: false
  stain_normalization: false
  grayscale: false

augmentation:
  policy: "deterministic_d4_only"
  use_opaque_keys: true

training:
  seeds: [42]
  outer_folds: 5
  inner_seed_formula: "seed * 1000 + outer_fold * 10 + 7"
  batch_size: 8
  grad_accum_steps: 2
  warmup_epochs: 3
  max_epochs: 30
  min_executed_epochs: 11
  head_warmup_lr: 3.0e-4
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  weight_decay: 1.0e-4
  adamw_betas: [0.9, 0.999]
  cosine_multiplier_low: 0.1
  grad_clip: 1.0
  patience: 8
  amp: true
  amp_init_scale: 32768.0

selection:
  criteria: ["mcc", "balanced_accuracy", "nll", "epoch"]

loss:
  condition: "convnextv2_tiny_raw_weighted_ce"
  float32_computation: true

outputs:
  models_dir: "outputs/models/convnextv2_tiny"
  predictions_dir: "outputs/predictions/convnextv2_tiny"
  metrics_dir: "outputs/metrics/convnextv2_tiny"
  gradcam_dir: "outputs/gradcam/convnextv2_tiny"
